site_name: mcp-embedded-ui
site_description: Cross-language specification for embedding a browser-based tool explorer into any MCP server.
site_url: https://aiperceivable.github.io/mcp-embedded-ui/
repo_url: https://github.com/aiperceivable/mcp-embedded-ui
repo_name: aiperceivable/mcp-embedded-ui

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Protocol Specification: PROTOCOL.md
  - Implementation Guide:
      - Overview: features/MANIFEST.md
      - Core Features:
          - "F1: HTML Frontend": features/html-frontend.md
          - "F2: Tool Discovery API": features/tool-discovery-api.md
          - "F3: Tool Execution API": features/tool-execution-api.md
          - "F7: Tool Validation API": features/tool-validation-api.md
      - Advanced Features:
          - "F4: Auth Hook": features/auth-hook.md
          - "F5: Framework Integration": features/framework-integration.md
          - "F6: Try-It Console": features/try-it-console.md
  - Development:
      - Roadmap: ROADMAP.md
      - Explorer Template: explorer.html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aiperceivable/mcp-embedded-ui
